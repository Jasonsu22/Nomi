[package]
name = "nomi"
version = "0.10.2"
description = "Nomi for Windows: live lecture transcription and translation on your PC"
edition = "2021"
license = "MIT"

[lib]
name = "nomi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json"] }
cpal = "0.15"
hound = "3.5"
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "mp3", "aac", "isomp4", "flac", "ogg", "vorbis"] }
sysinfo = "0.33"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
pdf-extract = "0.9"
lopdf = "0.36"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
trash = "5"
arboard = { version = "3", default-features = false, features = ["image-data"] }
open = "5"
# Live speakers: pyannote segmentation + voiceprints through sherpa-onnx (ONNX Runtime), the
# Windows counterpart of the Mac's FluidAudio "Standard" model. Static, so no extra DLLs ship.
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries", "static"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Media_Ocr", "Graphics_Imaging", "Storage", "Storage_Streams", "Globalization", "Foundation", "Foundation_Collections", "Win32_Foundation", "Win32_System_Registry"] }

[profile.release]
strip = true
lto = "thin"
