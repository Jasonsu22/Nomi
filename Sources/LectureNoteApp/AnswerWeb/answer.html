<!-- Nothing here loads from the network except https images. Model text is never parsed as HTML
     (markdown-it runs with html off). Demo frames inherit this policy, so it allows inline scripts for

<script src="vendor/markdown-it.min.js"></script>
<script src="vendor/katex.min.js"></script>
</head>
