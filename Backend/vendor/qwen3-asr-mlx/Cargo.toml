[package]
name = "qwen3-asr-mlx"
version = "0.1.0"
edition = "2021"
description = "Qwen3-ASR speech recognition on Apple Silicon with MLX"
license = "MIT OR Apache-2.0"

[dependencies]
# MLX framework
mlx-rs = { git = "https://github.com/OminiX-ai/OminiX-MLX.git", rev = "6aac996db8b71fb7dae7a2409c46b4f2ade93092", package = "mlx-rs", features = ["metal", "accelerate"] }
mlx-sys = { git = "https://github.com/OminiX-ai/OminiX-MLX.git", rev = "6aac996db8b71fb7dae7a2409c46b4f2ade93092", package = "mlx-sys" }

# Shared LLM infrastructure
mlx-rs-core = { git = "https://github.com/OminiX-ai/OminiX-MLX.git", rev = "6aac996db8b71fb7dae7a2409c46b4f2ade93092", package = "mlx-rs-core" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Tokenization
tokenizers = "0.21"

# Error handling
thiserror = "2"

# Audio processing
rubato = "0.16"
hound = "3.5"
rustfft = "6.2"

# Path utilities
dirs = "5"
