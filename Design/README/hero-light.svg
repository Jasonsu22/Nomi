  <text x="186" y="140" class="source"><tspan class="l0w0">Today</tspan> <tspan class="l0w1">we'll</tspan> <tspan class="l0w2">look</tspan> <tspan class="l0w3">at</tspan> <tspan class="l0w4">how</tspan> <tspan class="l0w5">neurons</tspan> <tspan class="l0w6">pass</tspan> <tspan class="l0w7">signals.</tspan></text>
  <text x="186" y="168" class="translation t0">今天我们来看看神经元是如何传递信号的。</text>
  <text x="128" y="216" class="stamp s1">0:19</text>
  <text x="186" y="216" class="source"><tspan class="l1w0">When</tspan> <tspan class="l1w1">a</tspan> <tspan class="l1w2">neuron</tspan> <tspan class="l1w3">fires,</tspan> <tspan class="l1w4">an</tspan> <tspan class="l1w5">action</tspan> <tspan class="l1w6">potential</tspan> <tspan class="l1w7">travels</tspan> <tspan class="l1w8">down</tspan> <tspan class="l1w9">the</tspan> <tspan class="l1w10">axon.</tspan></text>
  <text x="186" y="244" class="translation t1">神经元放电时，动作电位会沿着轴突传导。</text>
  <text x="128" y="292" class="stamp s2">0:27</text>
  <text x="186" y="292" class="source"><tspan class="l2w0">At</tspan> <tspan class="l2w1">the</tspan> <tspan class="l2w2">synapse,</tspan> <tspan class="l2w3">chemicals</tspan> <tspan class="l2w4">carry</tspan> <tspan class="l2w5">the</tspan> <tspan class="l2w6">message</tspan> <tspan class="l2w7">to</tspan> <tspan class="l2w8">the</tspan> <tspan class="l2w9">next</tspan> <tspan class="l2w10">cell.</tspan></text>
